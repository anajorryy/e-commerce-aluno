<mat-card class="produto-card">

  <mat-card-header>
    <mat-card-title class="produto-titulo">
      <span>{{ nome }}</span>
      <span class="produto-preco">R$ {{ preco }}</span>
    </mat-card-title>
  </mat-card-header>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="selecionarProduto()">
      Selecionar {{ nome }}
    </button>

    <button mat-stroked-button color="accent" (click)="adicionarAoCarrinho()">
      Adicionar ao Carrinho
    </button>
  </mat-card-actions>

</mat-card>
