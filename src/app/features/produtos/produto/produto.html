<mat-card class="produto-card">
    <mat-card-header>
    <mat-card-title>{{ nome | uppercase}}</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
    <p>{{ preco | precoFormatado }}</p>
    </mat-card-content>
    

    <mat-card-actions>
<button mat-raised-button collor="primary" (click)="selecionarProduto()">
        Selecionar {{ nome }}
    </button> 

    <button mat-stroked-button color="accent" (click)="adicionarCarrinho()">
        Adicionar ao Carrinho
    </button>
    </mat-card-actions>
     
</mat-card>
